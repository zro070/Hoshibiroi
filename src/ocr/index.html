<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>截图取词翻译</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14161c;
      --panel: #1b1e27;
      --border: rgba(255, 255, 255, 0.1);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --brand: #7c8cff;
      --brand-soft: rgba(124, 140, 255, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; height: 100vh;
      background: var(--bg); color: var(--text);
      font: 400 14px/20px "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .toolbar {
      flex: 0 0 48px; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .toolbar .brand { font-weight: 500; }
    .toolbar .hint { color: var(--muted); font-size: 13px; }
    .toolbar .spacer { flex: 1; }
    button {
      font: 500 13px/18px "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text); cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.06); }
    button.primary { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { flex: 1; display: flex; min-height: 0; }
    .stage { flex: 1; position: relative; overflow: hidden; }
    #canvas { position: absolute; }
    .marquee {
      position: fixed; display: none; border: 2px solid var(--brand);
      background: rgba(124, 140, 255, 0.12); z-index: 9; pointer-events: none;
      border-radius: 2px;
    }
    .tip {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); pointer-events: none; font-size: 15px;
    }
    .panel {
      flex: 0 0 320px; display: flex; flex-direction: column; gap: 12px;
      padding: 16px; border-left: 1px solid var(--border); background: var(--panel); overflow: auto;
    }
    textarea {
      flex: 1; min-height: 120px; resize: none; padding: 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font: 400 14px/22px "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    }
    .translation { min-height: 60px; padding: 12px; border-radius: 10px; background: var(--bg); white-space: pre-wrap; word-break: break-word; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="brand">截图取词 · OCR</span>
    <span class="hint">在截图上拖动框选要识别的文字</span>
    <span class="spacer"></span>
    <button id="close">关闭</button>
  </div>
  <main>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="marquee" id="marquee"></div>
      <div class="tip" id="tip">没有截图：请回到目标页面用快捷键 Alt+Shift+S 或右键「截图取词翻译」</div>
    </div>
    <div class="panel">
      <textarea id="text" placeholder="框选图片后，识别文本显示在这里，可编辑修正…"></textarea>
      <div class="translation" id="translation"></div>
      <div class="actions">
        <button id="translate" class="primary">翻译</button>
        <button id="favorite" disabled>收藏</button>
      </div>
    </div>
  </main>
  <script type="module" src="./index.ts"></script>
</body>
</html>
